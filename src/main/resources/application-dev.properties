spring.application.name=membertracker
# Server configuration
server.port=8080
server.address=127.0.0.1

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/felege_selam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Liquibase configuration
spring.liquibase.change-log=classpath:db/master.xml
spring.liquibase.enabled=true
# Load the sample users, members, payments and messages (002.sample-data.sql, context dev)
spring.liquibase.contexts=dev


# Auth: local http, so cookies cannot be Secure here
auth.cookies.secure=false
# Auth: explicit, local-only secret (at least 32 characters)
auth.jwt-secret=dev-only-secret-never-use-in-production-0123456789

# Application-specific configurations
app.payment.reminder.months-threshold=2
# app.payment.reminder.template=Dear {memberName}, your payment is now overdue by {monthsMissed} month(s). Please make your payment at your earliest convenience.

# Email configuration for development
app.mail.enabled=true
app.mail.from=dev-noreply@localhost
app.mail.smtp.host=localhost
app.mail.smtp.port=1025
app.mail.smtp.username=
app.mail.smtp.password=
app.mail.smtp.auth=false
app.mail.smtp.starttls-enable=false
app.mail.smtp.debug=true

# API documentation (Swagger UI), dev profile only
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
