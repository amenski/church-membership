plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'io.github'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.apache.commons:commons-lang3:3.15.0'
    implementation 'org.liquibase:liquibase-core:4.29.2'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    runtimeOnly 'com.mysql:mysql-connector-j'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}



bootJar {
    archiveFileName = "${rootProject.name}.jar"
    destinationDirectory = file("./target")

    from(tasks.getByPath(':frontend:vueBuild').outputs) {
        into "/static"
    }

    manifest {
        attributes "Implementation-Version": archiveVersion
        attributes "Implementation-Title": "Members Management"
    }
}


tasks.named('test') {
    useJUnitPlatform()
    // The default profile requires these; tests get local-only values here
    environment 'JWT_SECRET', 'test-only-secret-never-use-in-production-0123456789'
    environment 'DB_USERNAME', 'sa'
    environment 'DB_PASSWORD', 'sa'
}

// Report only: no coverage threshold, so it never fails the build.
// Run `./gradlew test jacocoTestReport`; output is in build/reports/jacoco/test/.
tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('test') {
    finalizedBy 'jacocoTestReport'
}

// Local `./gradlew bootRun` uses the dev profile unless SPRING_PROFILES_ACTIVE is set.
// bootJar is unaffected: a production JAR never defaults to dev.
tasks.named('bootRun') {
    if (!System.getenv('SPRING_PROFILES_ACTIVE')) {
        args '--spring.profiles.active=dev'
    }
}

// Development task - runs backend with hot reload
tasks.register('dev') {
    group 'application'
    description 'Run backend in development mode with hot reload'
    dependsOn 'bootRun'
}
